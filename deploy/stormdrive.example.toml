# stormdrive.toml — /etc/stormdrive/stormdrive.toml
# A missing file is fine: every value below shows its default.

listen_addr = "0.0.0.0:9092"
# Inventory + trend history persist here; unset = in-memory only.
data_dir = "/var/lib/stormdrive"
# node_name = ""            # default: hostname

[discovery]
interval_secs = 30
exclude = []                # extra '*' patterns on kernel names
include = []                # explicit allow-list; empty = all eligible
manage_mounted = false      # drives with mounted partitions are left alone

[monitor]
interval_secs  = 60
temp_warn_c    = 55
temp_crit_c    = 70
spare_warn_pct = 20
spare_crit_pct = 10
wear_warn_pct  = 80
wear_crit_pct  = 95
wear_out_warn_days = 180    # a warning event once the projected days to wear-out drop under this (#23)
hysteresis     = 3          # consecutive samples before a worsening sticks
max_concurrent = 8          # health reads in flight at once
sample_timeout_secs = 10    # a read slower than this is a failed sample

[stormblock]
enabled  = true
url      = "http://127.0.0.1:9090"
auto_add = false            # register qualified drives automatically (with location labels + stable uuid)
auto_format_slab = true     # …and format a slab on them, tier from tier_map / kind
push_health = true          # Failing/Failed → stormblock quarantines the drive and its legs (and itself drains a failed one)
drain_on_failing = true     # Failing/Failed in the fleet → drain, then retire when empty; false does not stop the engine's own drain
# The engine's bearer token (stormblock v17 requires it on all of /api/v1).
# Empty = $STORMBLOCK_API_TOKEN, then the first readable file of token_file,
# $STORMBLOCK_TOKEN_FILE, /run/stormblock/engine/api_token,
# /etc/stormblock/api_token, /var/lib/stormblock/api_token. Re-read while
# absent and on a 401, so the engine may mint or rotate it at any time.
# api_token = ""
# token_file = ""
# The engine's admin token, for slab format and drive close (stormblock#274).
# Empty = $STORMBLOCK_ADMIN_TOKEN, then the file (admin_token_file,
# $STORMBLOCK_ADMIN_TOKEN_FILE, /run/stormblock-admin/admin_token). Without
# one, stormdrive's [kubernetes] credential is presented (bind it to
# storage-admin or deploy/rbac.yaml's stormdrive-engine), then the node token.
# admin_token = ""
# admin_token_file = ""
# tier_map = { nvme_ssd = "hot", sas_ssd = "warm", sata_ssd = "warm", sas_hdd = "cool", sata_hdd = "cool" }

[api]                       # :9092's transport and callers (#19, #45): TLS, nothing anonymous but health
admin_token = ""            # break-glass bearer for a node with no apiserver; empty = $STORMDRIVE_ADMIN_TOKEN, then admin_token_file
admin_token_file = ""       # root-only file holding it
admin_gate = "enforce"      # enforce | audit (let writes through, log what enforce would refuse)
tls_cert_file = "/data/stormcert/stormdrive.crt"  # serving pair (stormcert-agent serving --cn stormdrive); re-read on change
tls_key_file = "/data/stormcert/stormdrive.key"   # until it exists: TLS handshakes fail, plain HTTP answers health only
client_ca_files = ["/data/stormcert/ca.crt"]      # client certificates verified against these (the node CA); missing files skipped
allow_anonymous = false     # TRANSITION: plain HTTP + reads with no credential as before; sent credentials still checked

[firmware]
chunk_kib = 32              # WRITE BUFFER / NVMe download chunk
max_image_mib = 256         # largest image PUT /api/v1/firmware/images accepts
redundancy_wait_mins = 30   # a data-serving drive waits this long for its volumes to be redundant (#24)

[worker]                    # the drive worker (POST /api/v1/worker/jobs)
max_per_hba = 8             # low-level steps at once behind one HBA
enroll_per_domain = 1       # enrolls at once per failure domain (shelf, else HBA)
offer = true                # mark blank, healthy, out-of-fleet drives `enrolable` (+ an event) (#42)
offer_min_bytes = 1073741824 # …when at least this big (1 GiB)

[history]                   # app-system-data (#64): drive history + hardware assets, kept across installs
dir = "/data/system-data"   # the system-data volume as mounted for stormdrive; absent = off (never created)
heartbeat_secs = 3600       # a drive record when a counter changes, else this often (monitor interval = every sample)
keep_months = 24            # history/drives/<drive>/<YYYY-MM>.jsonl older than this are removed

[kubernetes]                # the apiserver (#45): reviews bearers, holds Drive + DriveOperation objects
api_url = ""                # https://<apiserver>:6443; empty = $STORMDRIVE_KUBE_API, then in-cluster; none = writes need admin_token
ca_file = ""                # empty = $STORMDRIVE_KUBE_CA, then the service account's ca.crt
token_file = ""             # stormdrive's own credential (auth-delegator + stormdrive-controller); empty = $STORMDRIVE_KUBE_TOKEN_FILE, then the service account's
insecure = false            # skip TLS verification (lab only)
controller = true           # keep Drive objects, run this node's DriveOperations
interval_secs = 5           # between controller passes
