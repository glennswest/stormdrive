spec:
  group: storage.storm.io
  scope: Cluster
  names:
    kind: HostBusAdapter
    plural: hostbusadapters
    singular: hostbusadapter
    shortNames: [hba]
    categories: [storage]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - { name: Node, type: string, jsonPath: .status.node }
        - { name: PCI, type: string, jsonPath: .status.pci }
        - { name: Board, type: string, jsonPath: .status.board }
        - { name: Firmware, type: string, jsonPath: .status.firmwareVersion }
        - { name: BIOS, type: string, jsonPath: .status.biosVersion }
        - { name: Phys, type: integer, jsonPath: .status.linkedPhys }
        - { name: Drives, type: integer, jsonPath: .status.drives }
        - { name: NVDATA, type: string, jsonPath: .status.nvdataVersion, priority: 1 }
        - { name: Chip, type: string, jsonPath: .status.chip, priority: 1 }
        - { name: SASAddress, type: string, jsonPath: .status.sasAddress, priority: 1 }
      schema:
        openAPIV3Schema:
          type: object
          description: "A SAS card (mpt2sas/mpt3sas) as the stormdrive of its node reads it through the card's own interface, /dev/mpt3ctl (#166): IOC info and facts, Manufacturing Page 0, IO Unit Page 0, BIOS Page 3, SAS IO Unit Pages 0/1, every SAS Device and Enclosure page. Named <node>-<pci address>. Written by the node; a write to it changes nothing on the card. To change the card, a CardOperation."
          properties:
            spec:
              type: object
              description: Nothing to set; the node writes status.
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                node: { type: string }
                present: { type: boolean, description: "False once the node no longer sees the card." }
                pci: { type: string }
                scsiHost: { type: string }
                ioc: { type: integer }
                controlDevice: { type: string, description: "mpt3ctl or mpt2ctl." }
                adapter: { type: string, description: "SAS2, SAS3, SAS3.5." }
                board: { type: string, nullable: true }
                chip: { type: string, nullable: true }
                firmwareVersion: { type: string }
                biosVersion: { type: string, nullable: true }
                nvdataVersion: { type: string, nullable: true }
                sasAddress: { type: string, nullable: true }
                facts: { type: object, nullable: true, x-kubernetes-preserve-unknown-fields: true, description: "IOC Facts: mpiVersion, productId, capabilities, ports, maxTargets, …" }
                phys:
                  type: array
                  description: "Each phy: rate negotiated (rateMbps), maxRateMbps/minRateMbps the card is set to (SAS IO Unit Page 1), disabled, and the device attached (sasAddress, kind, the Drive)."
                  items: { type: object, x-kubernetes-preserve-unknown-fields: true }
                linkedPhys: { type: integer }
                devices:
                  type: array
                  description: "Every device the card lists (SAS Device Page 0): sasAddress, kind, present, access (the card's access status, when not 0), enclosure, slot, phy, and the Drive."
                  items: { type: object, x-kubernetes-preserve-unknown-fields: true }
                drives: { type: integer }
                enclosures:
                  type: array
                  description: "Enclosure Page 0: logicalId, slots, startSlot, and the Shelf whose logical id it is."
                  items: { type: object, x-kubernetes-preserve-unknown-fields: true }
                firmware:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: "images: each region read back from the card (FW Upload) — firmware, bios (and its legacy_bios / uefi parts), firmware_backup, manufacturing — with size, sha256, version; readAt."
                lastFlash: { type: object, nullable: true, x-kubernetes-preserve-unknown-fields: true, description: "The last CardOperation flash on this card: operation, region, image, sha256, before, after, started, finished, result." }
                problems: { type: array, items: { type: string }, description: "IOC exceptions and device access statuses, in words." }
                errors: { type: array, items: { type: string }, description: "What could not be read." }
