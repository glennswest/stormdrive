apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cardoperations.storage.storm.io
spec:
  group: storage.storm.io
  scope: Cluster
  names:
    kind: CardOperation
    plural: cardoperations
    singular: cardoperation
    shortNames: [cop]
    categories: [storage]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - { name: Node, type: string, jsonPath: .spec.node }
        - { name: Card, type: string, jsonPath: .spec.card }
        - { name: Region, type: string, jsonPath: .spec.region }
        - { name: Phase, type: string, jsonPath: .status.phase }
        - { name: Before, type: string, jsonPath: .status.before }
        - { name: After, type: string, jsonPath: .status.after }
        - { name: Message, type: string, jsonPath: .status.message, priority: 1 }
      schema:
        openAPIV3Schema:
          type: object
          description: "Flash a SAS card (#166, sas3flash's job, no vendor binary): the image is written with MPI FW Download, read back with FW Upload and compared, then the card is reset with the driver's host reset and asked its versions again. A read-back that differs is never reset. Refused while a drive on the card holds the node's system slab unless the Node is cordoned (spec.unschedulable). The reset waits for a moment with no I/O in flight on the card's drives (30 s); without one the image is written and runs at the card's next reset."
          required: [spec]
          properties:
            spec:
              type: object
              required: [node, card, op, region, image]
              properties:
                node: { type: string, description: "The node with the card (its stormdrive runs the operation)." }
                card: { type: string, description: "The HostBusAdapter's name, or the card's PCI address." }
                op: { type: string, enum: [flash] }
                region: { type: string, enum: [firmware, bios], description: "firmware: the IOC firmware; bios: the option ROM (legacy BIOS and UEFI driver)." }
                image:
                  type: object
                  description: "The golden (compliance-ops#23): the image's name in the node's firmware store (<data_dir>/firmware, POST /api/v1/firmware/images), its sha256 and the URL it was recorded from. The file's sha256 must be this one."
                  required: [name, sha256, source]
                  properties:
                    name: { type: string }
                    sha256: { type: string, pattern: "^[0-9a-fA-F]{64}$" }
                    source: { type: string }
                dryRun: { type: boolean, description: "Check the image and the guards, change nothing." }
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase: { type: string, enum: [Pending, Refused, Planned, Running, Succeeded, Written, Failed, Interrupted] }
                message: { type: string }
                requester: { type: string }
                step: { type: string, description: "download, verify, quiesce, reset, ready." }
                bytesDone: { type: integer }
                bytesTotal: { type: integer }
                imageVersion: { type: string, nullable: true }
                before: { type: string, nullable: true }
                after: { type: string, nullable: true }
                started: { type: string, nullable: true }
                finished: { type: string, nullable: true }
                observedGeneration: { type: integer, nullable: true }
