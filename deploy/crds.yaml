# stormdrive's Kubernetes kinds (#45), in the release's storage group
# (stormcos 47-storage-rbac.yaml: storage-admin may do everything to
# storage.storm.io, storage-viewer may read it). Cluster-scoped: a drive is
# hardware, it belongs to no namespace.
#
# - Drive: one per physical drive, written by the stormdrive of the node that
#   has it. Read it; writing it changes nothing on the drive (the node puts
#   its report back).
# - DriveOperation: format, sanitize, partition, enroll on one node's drives.
#   Creating one is the destructive act, so only storage-admin can. The node's
#   stormdrive re-checks the requester the apiserver stamped on it
#   (storage.storm.io/requester) with a SubjectAccessReview before it starts
#   and before every step.
# - DrivePolicy (#50): which drives of the nodes it selects become stormblock
#   slabs of which tier, reformatted first when they need it — the node's
#   stormdrive does it without anyone running an operation. Only
#   storage-admin can create one; its requester is re-checked the same way.
# - Shelf (#83): one per enclosure, SES or not (#152), written by the node that sees it
#   (status, conditions; issues are Events on it). Its spec is the user's:
#   identify, faultLed, defaultFormat. Changing spec is storage-admin's.
# - HostBusAdapter (#166): one per SAS card (mpt2sas/mpt3sas), written by the
#   node that has it: storcli's inventory from the card's own pages (identity,
#   versions, phys, devices joined to Drives, enclosures to Shelves, the
#   firmware regions read back). Status only.
# - CardOperation (#166): sas3flash's flash, ours: a firmware or BIOS image
#   recorded as a golden (store name, sha256, source) written to one card,
#   read back, then the card reset. Only storage-admin can create one; its
#   requester is re-checked like a DriveOperation's.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: drives.storage.storm.io
spec:
  group: storage.storm.io
  scope: Cluster
  names:
    kind: Drive
    plural: drives
    singular: drive
    shortNames: [drv]
    categories: [storage]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - { name: Node, type: string, jsonPath: .status.node }
        - { name: Device, type: string, jsonPath: .status.name }
        - { name: Model, type: string, jsonPath: .status.model }
        - { name: Size, type: integer, jsonPath: .status.capacityBytes }
        - { name: Sector, type: integer, jsonPath: .status.blockSize }
        - { name: Enclosure, type: string, jsonPath: .status.enclosure, priority: 1 }
        - { name: Bay, type: integer, jsonPath: .status.bay }
        - { name: Health, type: string, jsonPath: .status.health.status }
        - { name: Membership, type: string, jsonPath: .status.membership }
        - { name: SMR, type: string, jsonPath: .status.smr }
        - { name: Tier, type: string, jsonPath: .status.tier }
        - { name: Why, type: string, jsonPath: .status.membershipReason, priority: 1 }
        - { name: Link, type: string, jsonPath: .status.link.level }
        - { name: Owner, type: string, jsonPath: .status.owner }
        - { name: Prep, type: string, jsonPath: .status.prep.phase }
        - { name: SAS, type: string, jsonPath: .status.sasAddress, priority: 1 }
        - { name: Rate, type: string, jsonPath: .status.link.maximum, priority: 1 }
        - { name: Firmware, type: string, jsonPath: .status.firmware, priority: 1 }
        - { name: WCE, type: integer, jsonPath: .status.pages.caching.wce, priority: 1 }
        - { name: ATO, type: integer, jsonPath: .status.pages.control.ato, priority: 1 }
        - { name: QERR, type: integer, jsonPath: .status.pages.control.qerr, priority: 1 }
        - { name: DPICZ, type: integer, jsonPath: .status.pages.control.dpicz, priority: 1 }
        - { name: GRD_CHK, type: integer, jsonPath: .status.pages.extInquiry.grdChk, priority: 1 }
        - { name: WriteTest, type: boolean, jsonPath: .status.writeTest.passed, priority: 1 }
      schema:
        openAPIV3Schema:
          type: object
          description: A physical drive on a node, as that node's stormdrive sees it. The name is the drive's stable id (from its WWN, else model + serial).
          properties:
            spec:
              type: object
              description: "The node's own settings for the drive (designation, fleet, drain), mirrored. Change them through a DriveOperation or the node's API, not here. Set `format: {blockSize: 4096|512, protection: none|type1}` to ask for a format: the node plans it into status.plannedFormat (status.formatFrom says whether the drive's own format, its Shelf's defaultFormat or the 4096+PI1 preference decided it); a DriveOperation with that format step runs it (#85). Set `identify: true|false` for the drive's locate LED (#83). Set `linkRate: 6` (3, 6, 12 Gbit; \"1.5\", \"22.5\" and \"6 Gbit\" as strings) to hold the SAS phy facing a marginal drive at that rate: the node raises the drive's own programmed maximum first when it is below the rate (mode page 0x19/1, capped at its hardware, #159), writes the phy's maximum_linkrate and resets the link, on every boot, and status.link.maximum says `maximum 6 Gbit (policy)`; `hw` puts the hardware maximum back. Removing it changes nothing until the next boot. Never set by stormdrive itself (#149)."
              x-kubernetes-preserve-unknown-fields: true
              properties:
                linkRate:
                  x-kubernetes-int-or-string: true
                  description: "Hold the drive's SAS link at most at this rate (Gbit: 1.5, 3, 6, 12, 22.5), or `hw` (#149)."
                identify: { type: boolean }
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                node: { type: string }
                name: { type: string, description: "Kernel name (sdb, nvme0n1)." }
                path: { type: string }
                model: { type: string }
                serial: { type: string }
                firmware: { type: string }
                wwid: { type: string, nullable: true }
                capacityBytes: { type: integer }
                blockSize: { type: integer, description: "Logical sector size: 512, 4096, or 520/528 on a drive that needs a reformat." }
                needsReformat: { type: boolean }
                membershipReason: { type: string, nullable: true, description: "Why the drive is out of the fleet (#156), never a bare out: the DrivePolicy's skip (designated, in use, busy, failed, hot, host-managed SMR, a reformat the policy will not do, no health verdict yet), its job (queued, running, failed: edit the policy to try again), the policy waiting or suspended, or no DrivePolicy selecting it with each policy's first field that differs. The Member condition carries it with a reason word. In the fleet: null, except a fast member (#157): 'the fast tier: only what asks for fast uses it'." }
                smr: { type: string, nullable: true, enum: [none, host-managed, host-aware, drive-managed], description: "Shingled recording (#156): the kernel's queue/zoned (host-managed, host-aware), else ATA IDENTIFY DEVICE word 69 bits 1:0 on a SATA drive (10b drive-managed), else VPD 0xB1 ZONED, else a list of known drive-managed models (ST2000DM008 …). A host-managed drive is never enrolled by a DrivePolicy; a drive-managed one is a data drive like any other." }
                tier: { type: string, nullable: true, description: "The tier of the drive's slabs as the engine lists them (its data slab's, else any slab's; #157)." }
                smrSource: { type: string, nullable: true, description: "What said it: queue/zoned, ATA IDENTIFY word 69, VPD 0xB1, known model, nothing reports zoning." }
                formatReason: { type: string, nullable: true, description: "Why it needs a format when its sectors do not say so (#131): no block node, e.g. an interrupted format answering 31/00." }
                pages:
                  type: object
                  nullable: true
                  x-kubernetes-preserve-unknown-fields: true
                  description: "A SCSI drive's pages (#147, stormblock#636), read at discovery (again hourly) and by a DriveOperation op details. vpd: every VPD page the drive lists in 0x00, read whole (up to 4 KiB): [{page: \"0x86\", hex, said, strings, error}]; said for the standard pages (0x00 0x80 0x83 0x86 0x89 0x8F 0x90 0x91 0xB0 0xB1 0xB2 0xB4 0xB7), vendor pages (0xC0 and up) raw with their printable strings only. mode: 0x03 0x08 0x0A 0x19 0x1A 0x1C, [{page, hex (current), changeable (the bits MODE SELECT may set), said, error}]. Named bits for custom columns: control (0x0A: dpicz dSense qam qerr swp ato tas tst …), extInquiry (0x86: activateMicrocode spt grdChk appChk refChk …), caching (0x08: wce rcd dra …). readAt: unix seconds. A page's bytes are data, shown and never trusted."
                  properties:
                    vpd: { type: array, items: { type: object, x-kubernetes-preserve-unknown-fields: true } }
                    mode: { type: array, items: { type: object, x-kubernetes-preserve-unknown-fields: true } }
                    control: { type: object, nullable: true, x-kubernetes-preserve-unknown-fields: true }
                    extInquiry: { type: object, nullable: true, x-kubernetes-preserve-unknown-fields: true }
                    caching: { type: object, nullable: true, x-kubernetes-preserve-unknown-fields: true }
                    readAt: { type: integer }
                    error: { type: string, nullable: true }
                link:
                  type: object
                  nullable: true
                  x-kubernetes-preserve-unknown-fields: true
                  description: "The SAS link, both sides, read on every health sample (#149, stormblock#642): drive (log page 0x18: phys [{phy, rateMbps, attachedSas, invalidDwords, disparityErrors, lossOfSync, phyResets}] and rates [{phy, … per minute}]), host (the sysfs phy facing it, the HBA's or the shelf expander's: the same), hostPhy, negotiatedMbps, hostMaximumMbps, hostMaximumHwMbps, the drive's own limits from mode page 0x19/1 (#159: programmedMax and hardwareMax in Mb/s for the linked phy, programmedChangeable, driveLimits [{phy, negotiatedMbps, programmedMinMbps, programmedMaxMbps, hardwareMinMbps, hardwareMaxMbps}], driveLimit: \"6 of 12 Gbit (drive-programmed)\" or \"drive programmed 12 Gbit (hardware 12 Gbit)\"), maximum (\"maximum 6 Gbit (policy)\"), policy (spec.linkRate as applied), level (settling: the first reading or the counters went back; ok; degraded: anything moving; failing: loss of sync or phy resets moving two samples running), since, streak, syncStreak, message, recommendation (drive side only: the drive's receiver or its slot; both sides: the cable or the expander port), at."
                  properties:
                    level: { type: string, enum: [settling, ok, degraded, failing] }
                    maximum: { type: string, nullable: true }
                    programmedMax: { type: integer, nullable: true }
                    hardwareMax: { type: integer, nullable: true }
                    driveLimit: { type: string, nullable: true }
                    policy: { type: string, nullable: true }
                    message: { type: string }
                    recommendation: { type: string, nullable: true }
                conditions:
                  type: array
                  description: "LinkDegraded (link errors moving, failing included) and LinkFailing (loss of sync or phy resets moving two samples running), each with reason, message and lastTransitionTime (#149). A change raises a Kubernetes Event on the Drive. Member (#156): True (Enrolled) in the fleet; False with the reason (NoPolicy, NotSelected, Designated, InUse, Busy, Failed, Hot, HostManagedSMR, NeedsReformat, NoHealthYet, Enrolling, Planned, EnrollFailed, Waiting, Suspended, Missing, NotDecided) and status.membershipReason as its message."
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                    properties:
                      type: { type: string }
                      status: { type: string }
                      reason: { type: string }
                      message: { type: string }
                      lastTransitionTime: { type: string }
                writeTest:
                  type: object
                  nullable: true
                  x-kubernetes-preserve-unknown-fields: true
                  description: "The last write-test matrix run on the drive, from stormblock's card API (GET /api/v1/storage/hba/{sas}/write-test, stormblock#627; asked every 5 min for each drive with a SAS address; absent when the engine has none since it started) (#146): sasAddress, at (unix seconds), passed, stopped, via, vendor, product, revision, capacity, linkBefore, steps [{lba, wrprotect, write, read0, read1, readyAfter, linkAfter}], lines. The pages before and after stay on the engine."
                  properties:
                    passed: { type: boolean, nullable: true }
                    at: { type: integer, nullable: true }
                    revision: { type: string, nullable: true }
                    lines: { type: array, items: { type: string } }
                controllerState:
                  type: object
                  nullable: true
                  description: "What its RAID controller says of it (#132): controller, device_id, enclosure, slot, state (failed, unconfigured_good, jbod, …), state_code, size_bytes."
                  x-kubernetes-preserve-unknown-fields: true
                format:
                  type: object
                  nullable: true
                  x-kubernetes-preserve-unknown-fields: true
                  description: "The drive's last format, persisted across restarts (#108): state, phase, toBlockSize, protection, progressPct, etaSeconds, startedUnix, progressAtUnix, finishedUnix, refused (formats the drive refused, with why), blockSizeAfter + protTypeAfter (READ CAPACITY after it), error; method (auto/fast/full), methodUsed (fast, full, full_blocking), fastSkipped (why not fast: the drive's sense when it refused), already (at the format: nothing sent), logTail (the run's newest log lines; the whole log is GET /api/v1/drives/{id}/format/log) (#140)."
                owner: { type: string, enum: [free, stormblock, stormraid] }
                inUse: { type: boolean, description: "The drive is in use (#123): every destroying step and the designations that contradict its use refuse it." }
                use: { type: string, enum: [system, raid_member, data, slab_member, mounted, free], description: "What for: the node's system slab, a stormraid member, a data slab, otherwise held by the engine (fleet, whole-drive slab), a mounted partition, or free." }
                slabs:
                  type: array
                  items:
                    type: object
                    properties:
                      partition: { type: integer, nullable: true }
                      name: { type: string }
                      role: { type: string, enum: [system, data, unknown] }
                dependsOn: { type: array, items: { type: string }, description: "What stops working if it is destroyed: the node's root, its data half, a RAID set, the engine's volumes on it." }
                inUseReason: { type: string, nullable: true, description: "The sentence a refusal carries." }
                enclosure: { type: string, nullable: true }
                bay: { type: integer, nullable: true, description: "The bay: the physical bay when bayNumbering is platform (#134)." }
                controllerSlot: { type: integer, nullable: true, description: "The RAID controller's own slot number, beside the bay." }
                bayNumbering: { type: string, nullable: true, enum: [platform, controller], description: "platform = a [[bay_map]] entry for this system + controller; controller = the controller's numbering." }
                sasAddress: { type: string, nullable: true }
                membership: { type: string }
                activity: { type: string }
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: driveoperations.storage.storm.io
spec:
  group: storage.storm.io
  scope: Cluster
  names:
    kind: DriveOperation
    plural: driveoperations
    singular: driveoperation
    shortNames: [dop]
    categories: [storage]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - { name: Node, type: string, jsonPath: .spec.node }
        - { name: Phase, type: string, jsonPath: .status.phase }
        - { name: Requester, type: string, jsonPath: .status.requester }
        - { name: Job, type: string, jsonPath: .status.job, priority: 1 }
        - { name: Message, type: string, jsonPath: .status.message }
      schema:
        openAPIV3Schema:
          type: object
          description: Format, sanitize, partition or enroll a selection of one node's drives, or read their details (op details, non-destructive). A drive worker job (stormdrive POST /api/v1/worker/jobs) as an object.
          required: [spec]
          properties:
            spec:
              type: object
              required: [node, select, steps]
              properties:
                node:
                  type: string
                  description: The node whose drives these are (its stormdrive runs the operation).
                select:
                  type: object
                  description: Which drives. Every field given must match; at least one of drives, shelf, model, unusable.
                  properties:
                    drives: { type: array, items: { type: string }, description: "Handles: stable id, WWN, /dev path or name, serial." }
                    shelf: { type: string, description: "Logical id, serial, sysfs id or SES SCSI id." }
                    bays: { type: string, description: "Bays on that shelf, e.g. 0-11,14." }
                    model: { type: string }
                    unusable: { type: boolean, description: "Drives the kernel cannot use (520/528-byte sectors)." }
                steps:
                  type: array
                  description: In order, per drive. format/sanitize/security_erase/test/details/link_rate, then partition, then enroll; each at most once.
                  items:
                    type: object
                    required: [op]
                    properties:
                      op: { type: string, enum: [format, sanitize, security_erase, test, partition, enroll, details, link_rate], description: "details: read the drive's pages (every VPD page, the mode pages) and its health now into its Drive object (status.pages, status.health); changes nothing, runs on any drive that can answer, fleet drives included (#147). link_rate (#159): a SAS drive's link rate, `rate`: raises the drive's own programmed maximum when it is below it (mode page 0x19/1, capped at its hardware), then holds the phy facing it at that rate and resets the link; `hw` puts both back to their hardware maximum. Destroys nothing; runs where details runs (fleet drives too); the message says what it negotiated after." }
                      rate: { x-kubernetes-int-or-string: true, description: "link_rate: Gbit (1.5, 3, 6, 12, 22.5; \"1.5\" as a string) or hw." }
                      blockSize: { type: integer, description: "format: 512 or 4096." }
                      block_size: { type: integer }
                      protection: { type: string, enum: [none, type1], description: "format: T10 PI to format with (SCSI; the drive must offer it — Drive status.supports)." }
                      method: { type: string, enum: [block, crypto, overwrite], description: "sanitize." }
                      kind: { type: string, enum: [smoke, read_scan, destructive_sample], description: "test: which drive test (a failed one stops the drive's later steps)." }
                      enhanced: { type: boolean, description: "security_erase: enhanced erase (default: when the drive supports it)." }
                      role: { type: string, enum: [data, system], description: "partition/enroll." }
                      tier: { type: string, description: "enroll: the slab's tier (default from the drive kind)." }
                destroy:
                  type: array
                  items: { type: string }
                  description: Drives whose current contents (a stormblock slab, a stormraid set, a filesystem) may be destroyed, by stable id, WWN or serial — never a /dev name. An owner has to let go first (leave the fleet, delete the RaidSet).
                iKnowInUse:
                  type: array
                  items: { type: string }
                  description: Drives in use (the system drive, a drive with slabs, a RAID member — status.inUse) a destroying step may still take, by stable id, WWN or serial. Needed besides destroy, which alone never destroys a drive in use (#123). Consoles do not offer it for the system drive. A fleet drive or a mounted one is refused whatever is named.
                dryRun:
                  type: boolean
                  description: Report the plan (which drives would run, which are refused and why) and do nothing.
                resume:
                  type: integer
                  description: Raise to resume the drives a restart or an unreachable apiserver interrupted.
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase: { type: string, description: "Pending, Refused, Planned, Running, Interrupted, Succeeded, Failed, Cancelled." }
                message: { type: string }
                requester: { type: string, nullable: true }
                job: { type: string }
                observedGeneration: { type: integer, nullable: true }
                resumed: { type: integer }
                drives:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: drivepolicies.storage.storm.io
spec:
  group: storage.storm.io
  scope: Cluster
  names:
    kind: DrivePolicy
    plural: drivepolicies
    singular: drivepolicy
    shortNames: [dpol]
    categories: [storage]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - { name: Nodes, type: string, jsonPath: .spec.nodes }
        - { name: Tier, type: string, jsonPath: .spec.enroll.tier }
        - { name: Reformat, type: integer, jsonPath: .spec.reformat }
        - { name: Suspend, type: boolean, jsonPath: .spec.suspend, priority: 1 }
      schema:
        openAPIV3Schema:
          type: object
          description: Which drives of the selected nodes become stormblock slabs of which tier, reformatted first when the kernel cannot use them. Each node's stormdrive applies it to its own drives through the drive worker, never to a drive in the fleet, holding data (a slab, a RAID set, a filesystem), designated reserved, spare, failed or system, or failing.
          required: [spec]
          properties:
            spec:
              type: object
              required: [enroll]
              properties:
                nodes:
                  type: array
                  items: { type: string }
                  description: "Node names. At least one of nodes, nodeSelector.matchLabels; both given = both must match. Neither (#162) only when drives.systemDrive and drives.kinds are both given: the policy is then for every node, narrowed by its drives."
                nodeSelector:
                  type: object
                  properties:
                    matchLabels:
                      type: object
                      additionalProperties: { type: string }
                      description: Labels the Node object must carry.
                drives:
                  type: object
                  description: Which drives on those nodes. Every field given must match; none = every drive.
                  properties:
                    kinds:
                      type: array
                      items: { type: string, enum: [nvme_ssd, sas_ssd, sas_hdd, sata_ssd, sata_hdd, unknown] }
                    minBytes: { type: integer }
                    maxBytes: { type: integer }
                    blockSizes:
                      type: array
                      items: { type: integer }
                      description: Logical sector sizes as the drive reports them, e.g. [520, 512].
                    model: { type: string }
                    shelf: { type: string, description: "The enclosure: logical id, serial or sysfs id." }
                    bays: { type: string, description: "Bays on that shelf, e.g. 0-11,14 (needs shelf)." }
                    smr:
                      type: array
                      items: { type: string, enum: [none, drive-managed, host-aware, host-managed] }
                      description: "The drive's status.smr must be one of these (#156); empty = any. A host-managed drive is never enrolled whatever this says."
                    systemDrive: { type: string, enum: [rotating, solid-state], description: "The node's own system drive (the one holding its system slab) must be of this media (#157): the blades' SSD beside a rotating system drive is a fast slab." }
                reformat:
                  type: integer
                  enum: [512, 4096]
                  description: Reformat a drive the kernel cannot use (520/528-byte sectors) to this size first. A drive at 512 or 4096 keeps its size.
                enroll:
                  type: object
                  required: [tier]
                  properties:
                    role: { type: string, enum: [data, system], description: "The slab's role (default data)." }
                    tier: { type: string, enum: [hot, warm, cool, cold, fast], description: "The slab's tier: what stormstorage pools select by. fast (#157) is never in a default placement or fallback chain: only what asks for fast uses it." }
                requireDataSlab:
                  type: boolean
                  description: Act only on a node that already has a stormblock data slab (phase Waiting until it does) — grow a storage node, never make one.
                suspend:
                  type: boolean
                  description: Start nothing new (what runs finishes).
                dryRun:
                  type: boolean
                  description: Report per drive what would run (status.nodes.<node>.drives) and do nothing.
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                nodes:
                  type: object
                  description: "Per node: phase (Active, Planned, Waiting, Suspended, Refused, Pending, Invalid), message, requester, observedGeneration, and drives by stable id: state (skipped, planned, queued, running, enrolled, failed, refused, cancelled, interrupted), reason, job, steps, generation."
                  x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: shelves.storage.storm.io
spec:
  group: storage.storm.io
  scope: Cluster
  names:
    kind: Shelf
    plural: shelves
    singular: shelf
    shortNames: [shf]
    categories: [storage]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - { name: Node, type: string, jsonPath: .status.node }
        - { name: Model, type: string, jsonPath: .status.model }
        - { name: ID, type: string, jsonPath: .status.shelfId }
        - { name: State, type: string, jsonPath: .status.state }
        - { name: Healthy, type: string, jsonPath: ".status.conditions[?(@.type=='Healthy')].status" }
        - { name: SinglePath, type: string, jsonPath: ".status.conditions[?(@.type=='SinglePath')].status" }
        - { name: Identify, type: boolean, jsonPath: .status.identify, priority: 1 }
        - { name: Serial, type: string, jsonPath: .status.serial, priority: 1 }
      schema:
        openAPIV3Schema:
          type: object
          description: A disk shelf (any enclosure, SES or not) as the stormdrive of the node that sees it reports it (#83). The name is the shelf's key (its SES logical id; internal-<node>-<controller> read through a RAID controller; the enclosure id the SAS transport gives for a backplane with no SES behind an HBA, #152). A Drive's status.enclosure names it. Issues are Kubernetes Events on it.
          properties:
            spec:
              type: object
              description: Yours; the node never writes it.
              properties:
                identify: { type: boolean, description: "The shelf's locate LED (enclosure IDENT)." }
                faultLed: { type: boolean, description: "The shelf's fault LED (enclosure REQUEST FAILURE)." }
                defaultFormat:
                  type: object
                  description: The format planned for a drive in this shelf whose own Drive has no spec.format (a RAID set or a drive decides its own; this is only the default for drives not yet assigned). Running it is still a DriveOperation.
                  required: [blockSize]
                  properties:
                    blockSize: { type: integer, enum: [512, 4096] }
                    protection: { type: string, enum: [none, type1], default: none }
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                node: { type: string }
                present: { type: boolean, description: "False once the node no longer sees the shelf." }
                vendor: { type: string, nullable: true }
                model: { type: string, nullable: true }
                shelfId: { type: string, nullable: true }
                serial: { type: string, nullable: true }
                position: { type: string, enum: [internal, front, rear, external], description: "Where the shelf is on the machine, in the engine's words (stormblock#347)." }
                through: { type: object, nullable: true, x-kubernetes-preserve-unknown-fields: true, description: "Set when no SES device answers for the shelf: read through its RAID controller (driver megaraid_sas) or its SAS HBA (#152: bay_phys, bay → phy, phy_name, rate_mbps, sas_address)." }
                bays:
                  type: array
                  description: "Every bay known: state occupied (drive, name, wwid, model, health, blockSize, needsReformat; or sasAddress for an end device that is no drive of this node's) or empty; phy and linkRateMbps when read through an HBA (#152)."
                  items: { type: object, x-kubernetes-preserve-unknown-fields: true }
                state: { type: string }
                identify: { type: boolean, nullable: true }
                faultLed: { type: boolean, nullable: true, description: "Fault requested by a client (spec.faultLed or anyone else)." }
                faultIndicated: { type: boolean, nullable: true, description: "The shelf's own failure indication." }
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type: { type: string, enum: [Healthy, SinglePath, PSUDegraded, FanDegraded, OverTemp] }
                      status: { type: string, enum: ["True", "False", Unknown] }
                      reason: { type: string }
                      message: { type: string }
                      lastTransitionTime: { type: string }
