# stormcos#251's two storage tiers (stormcos docs/STORAGE-TIERS.md): every
# drive on stormblock1's 2.5-inch NetApp shelf becomes a `warm` data slab,
# every SAS HDD on stormblock2 a `cool` one. A fresh NetApp drive (520-byte
# sectors) is reformatted to 4096 first. Needs storage-admin (#50).
#
# Never touched: a drive in the fleet, holding data (a slab, a RAID set, a
# filesystem), designated reserved/spare/failed/system, or failing. A drive whose
# job fails is not tried again until the policy is edited.
#
# Try dryRun: true first; status.nodes.<node>.drives says, per drive, what
# would run or why it is skipped.
#
#   kubectl apply -f drivepolicy.example.yaml
#   kubectl get drivepolicies
#   kubectl get drivepolicy stormblock1-warm -o jsonpath='{.status.nodes}'
apiVersion: storage.storm.io/v1
kind: DrivePolicy
metadata:
  name: stormblock1-warm
spec:
  nodes: [stormblock1]
  drives:
    kinds: [sas_hdd, sas_ssd]
    shelf: "500a098000000000"   # the shelf's logical id (kubectl get drives -o wide)
  reformat: 4096
  enroll:
    role: data
    tier: warm
  dryRun: true
---
apiVersion: storage.storm.io/v1
kind: DrivePolicy
metadata:
  name: stormblock2-cool
spec:
  nodes: [stormblock2]
  drives:
    kinds: [sas_hdd]
  reformat: 4096
  enroll:
    role: data
    tier: cool
  dryRun: true
---
# The blades' default (#157, stormblock#672, the owner's final shape): every
# blade runs system and data on its rotating drive (stormblock's /init takes
# a rotating drive before a solid-state one), so the HDD is never enrolled
# here. The SSD beside it, where a blade has one (server8's Patriot P210), is
# an extra data slab of tier `fast`: empty by default, and only a workload
# that asks for `fast` uses it (the build VMs' private drive first). A blade
# with no SSD (server1-7) has nothing this selects. SMR is shown on the Drive
# object and never a reason to leave a drive out (a host-managed one alone is
# skipped: its zones take sequential writes only). The real manifest is
# stormcos's (stormcos#1039); a drive this leaves out says why in its Drive
# object (status.membershipReason, condition Member).
#
# It names no node (#162, stormcos#1039): a policy with neither nodes nor
# nodeSelector is taken when drives.systemDrive and drives.kinds are both
# given, and is then for every node. A node whose system drive is on an SSD
# or NVMe selects nothing; nor does a node with no SSD.
apiVersion: storage.storm.io/v1
kind: DrivePolicy
metadata:
  name: blades-ssd-fast
spec:
  drives:
    kinds: [sata_ssd, sas_ssd, nvme_ssd]
    systemDrive: rotating
  enroll:
    role: data
    tier: fast
