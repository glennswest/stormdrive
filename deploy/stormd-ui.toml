# Snippet for the node's stormd config: supervises stormdrive and gives the
# dashboard a card (summary pull, 400 ms budget — served from cache).
# stormdrive serves no page (#84): its UI is stormconsole's drive plugin.

[[process]]
name = "stormdrive"
command = "/usr/sbin/stormdrive"
args = ["--config", "/etc/stormdrive/stormdrive.toml"]

[process.ui]
label   = "Drives"
summary = "http://127.0.0.1:9092/api/v1/summary"
