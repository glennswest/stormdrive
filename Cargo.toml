[package]
name = "stormdrive"
version = "0.27.1"
edition = "2021"
rust-version = "1.75"
description = "Physical drive management for the Storm ecosystem — discovery, health, wear, thermal, firmware, location"
license = "MIT"

[dependencies]
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
stormview = { git = "https://github.com/glennswest/stormview", rev = "81ef1d2875d9c8247cb1b41fd7db2985bdf2ce60" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Every remote call retries through one helper (#71).
stormdrive-retry = { path = "retry" }
# :9092's TLS (#19): the stormcert serving pair, node-CA client certificates.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
x509-parser = "0.16"

[dev-dependencies]
# tests/tls.rs mints a CA, a serving pair and client pairs (#19).
rcgen = "0.13"
# tests/suites.rs runs the test container's suites against this daemon (#11).
stormdrive-test = { path = "test" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# retry/ is the shared retry helper (#71), used by the daemon and test/.
# test/ is the test container's crate (#11): a member so one Cargo.lock pins it,
# and a default member so sc-build's `cargo test` runs its unit tests too.
[workspace]
members = [".", "test", "retry"]
default-members = [".", "test", "retry"]

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
